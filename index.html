<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>링크인 · 나만의 링크 페이지</title>
  <meta name="description" content="나만의 링크 페이지를 만들어 공유하세요." />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='11' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M8.5 12a2.2 2.2 0 0 1 2.2-2.2h1.6V8.4h-1.6a3.6 3.6 0 0 0 0 7.2h1.6v-1.4h-1.6A2.2 2.2 0 0 1 8.5 12zm2.7.7h4.2v-1.4h-4.2v1.4zm2.1-4.3v1.4h1.6a2.2 2.2 0 0 1 0 4.4h-1.6v1.4h1.6a3.6 3.6 0 0 0 0-7.2h-1.6z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-landing">
  <div id="bg" class="bg gradient"></div>
  <div class="bg-overlay"></div>

  <header class="lp-nav">
    <a class="lp-brand" href="index.html">
      <span class="lp-logo">🔗</span><span id="brand-name">링크인</span>
    </a>
    <div class="lp-nav-right">
      <button id="nav-auth" class="lp-btn ghost sm">로그인</button>
    </div>
  </header>

  <main class="landing">
    <section class="hero">
      <h1 class="hero-title">나만의 링크를 <span class="grad">한 페이지</span>에</h1>
      <p class="hero-sub" id="hero-sub">모든 SNS와 연락처를 한 곳에 모아 나만의 링크로 공유하세요.</p>
      <div class="hero-cta">
        <button id="cta-create" class="lp-btn primary lg">내 프로필 만들기</button>
        <a href="#explore" class="lp-btn ghost lg">둘러보기</a>
      </div>
      <p class="hero-hint" id="hero-hint"></p>
    </section>

    <section id="explore" class="explore">
      <div class="explore-head">
        <h2>공개 프로필</h2>
        <span class="explore-count" id="explore-count"></span>
      </div>
      <div id="grid" class="grid" aria-live="polite">
        <div class="grid-loading">불러오는 중…</div>
      </div>
    </section>
  </main>

  <footer class="lp-foot">
    <span id="foot-name">링크인</span> · 나만의 링크 페이지
  </footer>

  <!-- 아이디 만들기(온보딩) 모달 -->
  <div id="onboard" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ob-title">
      <button class="modal-x" data-close aria-label="닫기">✕</button>
      <h3 id="ob-title">프로필 아이디 정하기</h3>
      <p class="modal-desc">프로필 주소에 사용됩니다. 나중에 바꿀 수 없어요.</p>
      <div class="ob-input">
        <span class="ob-prefix">.../profile.html?u=</span>
        <input id="ob-username" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" maxlength="20" placeholder="myname" />
      </div>
      <div id="ob-status" class="ob-status"></div>
      <button id="ob-submit" class="lp-btn primary lg" disabled>만들기</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="landing.js"></script>
</body>
</html>
