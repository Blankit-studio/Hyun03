<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>내 링크 모음</title>
  <meta name="description" content="제 모든 링크를 한 곳에 모았어요." />
  <meta name="theme-color" content="#0a0a0f" />
  <meta property="og:title" content="내 링크 모음" />
  <meta property="og:description" content="제 모든 링크를 한 곳에 모았어요." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='11' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M8.5 12a2.2 2.2 0 0 1 2.2-2.2h1.6V8.4h-1.6a3.6 3.6 0 0 0 0 7.2h1.6v-1.4h-1.6A2.2 2.2 0 0 1 8.5 12zm2.7.7h4.2v-1.4h-4.2v1.4zm2.1-4.3v1.4h1.6a2.2 2.2 0 0 1 0 4.4h-1.6v1.4h1.6a3.6 3.6 0 0 0 0-7.2h-1.6z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 배경 -->
  <div id="bg" class="bg"></div>
  <div class="bg-overlay"></div>

  <!-- 메인 카드 -->
  <main id="app" class="app">
    <section class="card" id="card">
      <div class="card-glow"></div>

      <div class="avatar-wrap">
        <img id="avatar-img" class="avatar" alt="프로필 이미지" hidden />
        <div id="avatar-fallback" class="avatar avatar-fallback"></div>
      </div>

      <h1 class="username">
        <span id="username-text"></span>
        <svg id="verified-badge" class="badge" viewBox="0 0 24 24" hidden aria-label="인증됨">
          <path fill="currentColor" d="M12 1l2.4 2.1 3.1-.5 1.2 2.9 2.9 1.2-.5 3.1L23 12l-2.1 2.4.5 3.1-2.9 1.2-1.2 2.9-3.1-.5L12 23l-2.4-2.1-3.1.5-1.2-2.9L2.4 16.3l.5-3.1L1 12l2.1-2.4-.5-3.1 2.9-1.2L6.7 2.4l3.1.5z"/>
          <path fill="#0a0a0f" d="M10.6 14.6l-2.3-2.3 1.1-1.1 1.2 1.2 3.2-3.2 1.1 1.1z"/>
        </svg>
      </h1>

      <p class="bio"><span id="bio-text"></span></p>

      <div id="links" class="links"></div>

      <div class="footer">
        <span id="views" class="views" hidden>👁 <b id="views-count">0</b> 조회</span>
      </div>
    </section>
  </main>

  <!-- 관리자(나) 로그인 / 편집 버튼 -->
  <button id="admin-btn" class="admin-btn" title="관리자 로그인" aria-label="관리자">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1l-.4-2.5h-3.8l-.4 2.5a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.4 2.5h3.8l.4-2.5a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <!-- Firebase 연동 (firebase-config.js 설정 시 활성화) -->
  <script src="firebase-config.js"></script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
