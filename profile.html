<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>프로필</title>
  <meta name="description" content="링크 프로필" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='11' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M8.5 12a2.2 2.2 0 0 1 2.2-2.2h1.6V8.4h-1.6a3.6 3.6 0 0 0 0 7.2h1.6v-1.4h-1.6A2.2 2.2 0 0 1 8.5 12zm2.7.7h4.2v-1.4h-4.2v1.4zm2.1-4.3v1.4h1.6a2.2 2.2 0 0 1 0 4.4h-1.6v1.4h1.6a3.6 3.6 0 0 0 0-7.2h-1.6z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-profile">
  <div id="bg" class="bg"></div>
  <div class="bg-overlay"></div>

  <!-- 홈으로 -->
  <a class="home-btn" href="index.html" title="홈으로" aria-label="홈으로">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>
  </a>

  <!-- 메인 카드 -->
  <main id="app" class="app">
    <section class="card" id="card">
      <div class="card-glow"></div>

      <div class="avatar-wrap">
        <img id="avatar-img" class="avatar" alt="프로필 이미지" hidden />
        <div id="avatar-fallback" class="avatar avatar-fallback"></div>
      </div>

      <h1 class="username">
        <span id="username-text"></span>
        <svg id="verified-badge" class="badge" viewBox="0 0 24 24" hidden aria-label="인증됨">
          <path fill="currentColor" d="M12 1l2.4 2.1 3.1-.5 1.2 2.9 2.9 1.2-.5 3.1L23 12l-2.1 2.4.5 3.1-2.9 1.2-1.2 2.9-3.1-.5L12 23l-2.4-2.1-3.1.5-1.2-2.9L2.4 16.3l.5-3.1L1 12l2.1-2.4-.5-3.1 2.9-1.2L6.7 2.4l3.1.5z"/>
          <path fill="#0a0a0f" d="M10.6 14.6l-2.3-2.3 1.1-1.1 1.2 1.2 3.2-3.2 1.1 1.1z"/>
        </svg>
      </h1>
      <div id="handle" class="handle" hidden></div>

      <p class="bio"><span id="bio-text"></span></p>

      <div id="links" class="links"></div>

      <div class="footer">
        <span id="views" class="views" hidden>👁 <b id="views-count">0</b> 조회</span>
      </div>
    </section>
  </main>

  <!-- 프로필을 찾을 수 없을 때 -->
  <div id="notfound" class="notfound" hidden>
    <div class="nf-card">
      <div class="nf-emoji">🔍</div>
      <h2 id="nf-title">프로필을 찾을 수 없어요</h2>
      <p id="nf-desc">주소를 확인하거나, 나만의 프로필을 만들어 보세요.</p>
      <a class="lp-btn primary lg" href="index.html">홈으로 가기</a>
    </div>
  </div>

  <!-- 소유자 편집 버튼 -->
  <button id="admin-btn" class="admin-btn" title="편집" aria-label="편집" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
  </button>

  <!-- 링크 복사 버튼(소유자) -->
  <button id="share-btn" class="share-btn" title="프로필 링크 복사" aria-label="링크 복사" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7h-4a5 5 0 0 0 0 10h4v-1.9h-4A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm5-6v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10h-4z"/></svg>
  </button>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="profile.js"></script>
</body>
</html>
